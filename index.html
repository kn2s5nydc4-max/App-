<title>Cube Lab</title>
<style>
:root { --bg: #e8ecf5; --ink: #131936; --ink-2: #48517c; --line: rgba(19, 25, 54, .16); --field: #ffffff; --accent: #b81fcf; --err: #c9253b; color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --ink: #eef0ff; --ink-2: #aab2da; --line: rgba(168, 180, 255, .2); --field: #141b37; --accent: #df47f2; --err: #ff6b7d; color-scheme: dark; } }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
main { min-height: 100%; display: grid; place-items: center; padding: 24px; }
form { width: min(100%, 420px); display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
p { margin: 0; color: var(--ink-2); }
textarea { width: 100%; min-height: 104px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: 500 17px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; resize: none; }
.remember { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 15px; }
.remember input { width: 20px; height: 20px; accent-color: var(--accent); }
button { height: 52px; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; cursor: pointer; }
button:disabled { opacity: .55; cursor: default; }
.err { min-height: 1.4em; color: var(--err); font-size: 15px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
